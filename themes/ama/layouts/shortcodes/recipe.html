<!-- infrastructure -->
<script src="//unpkg.com/alpinejs" defer></script>
 
<!-- recipe content -->
<!-- todo: rename amoutn to multiplier-->
<div 
    class='recipe'
    x-data='{ base: {{ .Get "default" }}, amount: 1 }'
    x-init='$watch("base", base => { amount = base/ {{ .Get "default" }}; })'
    >
    <p>
        Portion multiplier:
        <button @click="base = 1">50%</button>
        <button @click="base = 1.5">75%</button>
        <button @click="base = 2">100%</button>
        <button @click="base = 3">150%</button>
        <button @click="base = 4">200%</button>
        <!--<input type="number" x-model="base" />-->
    </p>
    <p>
        {{.Inner}}
    </p>
</div>
